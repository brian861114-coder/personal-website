<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Brian | Semiconductor &amp; AI Engineer</title>
  <link rel="icon" type="image/png" href="../assets/application-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Light Blue Gradient: 淺藍漸層 ===== */
    :root {
      --bg-white: #ffffff;
      --bg-warm: #e8f2fb;
      --bg-gradient-start: #e8f2fb;
      --bg-gradient-mid: #eef5fc;
      --bg-gradient-end: #f4f8fd;
      --text-primary: rgba(0,0,0,0.95);
      --text-secondary: var(--text-primary);
      --text-tertiary: #5a6b82;
      --accent: #0075de;
      --accent-hover: #005bab;
      --badge-bg: #e8f4fd;
      --badge-text: #0068d6;
      --border: rgba(0,0,0,0.08);
      --card-bg: rgba(255,255,255,0.75);
      --card-bg-hover: rgba(255,255,255,0.92);
      --shadow-card: rgba(0,0,0,0.04) 0px 4px 18px, rgba(0,0,0,0.02) 0px 2px 7px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(54px + env(safe-area-inset-top, 0px) + 12px);
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 40%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Navigation */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(232,242,251,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    nav .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    nav .logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      min-width: 0;
      line-height: 1.25;
    }
    nav .logo:hover { color: var(--text-primary); }
    .nav-end { display: flex; gap: 24px; list-style: none; align-items: center; flex-shrink: 0; }
    nav .nav-links { display: flex; gap: 24px; list-style: none; align-items: center; }
    nav .nav-links a {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav .nav-links a:hover { color: var(--accent); }
    .nav-cta {
      background: var(--accent);
      color: #fff !important;
      padding: 7px 15px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
    }
    .nav-cta:hover { background: var(--accent-hover); color: #fff !important; }
    .nav-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

    /* 語言切換：次要層級，讓藍色 Contact 保持唯一的主要行動。
       放在 nav 右端，sticky nav 讓它在手機上也一直可見。 */
    .nav-lang {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .nav-lang:hover { color: var(--accent); border-color: var(--accent); }

    /* Hero */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 56px 24px 24px;
      text-align: center;
    }
    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.05;
      letter-spacing: -0.033em;
      margin-bottom: 12px;
    }
    .hero .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 22%;
      border: 4px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      margin-bottom: 20px;
    }
    .hero .subtitle {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.4;
      letter-spacing: -0.006em;
      margin-bottom: 28px;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      flex-wrap: wrap;
    }
    .hero-stats .stat { display: flex; flex-direction: column; align-items: center; }
    .hero-stats .stat b {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .hero-stats .stat span {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .hero .cta-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-secondary {
      background: rgba(0,0,0,0.05);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: rgba(0,0,0,0.08); }

    /* Sections */
    section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    section.warm { background: var(--bg-warm); max-width: 100%; }
    section.warm .inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    section h2 {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.00;
      letter-spacing: -0.031em;
      text-align: center;
      margin-bottom: 12px;
    }
    section .section-desc {
      text-align: center;
      color: var(--text-secondary);
      font-size: 16px;
      margin-bottom: 48px;
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }
    .about-text { font-size: 16px; line-height: 1.6; color: #1a1a1a; }
    .about-text p { margin-bottom: 14px; }
    .info-cards { display: flex; flex-direction: column; gap: 8px; }
    .info-card {
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .info-card:nth-child(1) { border-left-color: #0075de; }
    .info-card:nth-child(2) { border-left-color: #5e6ad2; }
    .info-card:nth-child(3) { border-left-color: #10b981; }
    .info-card:nth-child(4) { border-left-color: #f59e0b; }
    .info-card strong { color: var(--text-primary); font-weight: 600; }

    /* Timeline */
    .timeline { border-left: 1px solid var(--border); padding-left: 28px; margin-left: 12px; }
    .timeline-item { margin-bottom: 28px; position: relative; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -34px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    .timeline-item .date {
      font-size: 12px;
      font-weight: 600;
      color: var(--badge-text);
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin-bottom: 4px;
      display: inline-block;
      background: var(--badge-bg);
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .timeline-item h3 { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .timeline-item .org { font-size: 17px; color: var(--text-secondary); margin-bottom: 4px; }
    .timeline-item p { font-size: 16px; color: var(--text-primary); }
    .timeline-item .details { margin-top: 8px; padding-left: 16px; }
    .timeline-item .details li { font-size: 15px; color: var(--text-secondary); line-height: 1.6; list-style: disc; }

    /* Skills */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .skill-card {
      display: block;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, rgba(0,117,222,0.30), rgba(94,106,210,0.20), rgba(16,185,129,0.15), rgba(245,158,11,0.12));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .skill-card:hover { transform: translateY(-2px); }
    .skill-card:nth-child(1) { background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, rgba(0,117,222,0.35), rgba(94,106,210,0.22)); }
    .skill-card:nth-child(2) { background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, rgba(94,106,210,0.35), rgba(16,185,129,0.22)); }
    .skill-card:nth-child(3) { background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, rgba(16,185,129,0.35), rgba(245,158,11,0.22)); }
    .skill-card:nth-child(4) { background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, rgba(245,158,11,0.30), rgba(0,117,222,0.20)); }
    .skill-card h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.01em;
    }

    /* Card track (Motion-style horizontal snap) */
    .card-track { min-width: 0; }
    .card-track-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: -24px 0 28px;
    }
    .track-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s, opacity 0.2s;
    }
    .track-btn:hover:not(:disabled) { color: var(--text-primary); background: rgba(0,0,0,0.04); }
    .track-btn:disabled { opacity: 0.28; cursor: default; }
    .card-track-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .card-track-scroll::-webkit-scrollbar { display: none; }
    .card-track-scroll > * {
      flex: 0 0 calc((100% - 32px) / 3);
      min-width: 0;
      scroll-snap-align: start;
      height: auto;
    }

    /* Research */
    .research-card {
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    a.research-card { text-decoration: none; color: inherit; cursor: pointer; }
    .research-card:hover { transform: translateY(-2px); }
    .card-more {
      margin-top: auto;
      padding-top: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }
    .research-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .research-card .journal { font-size: 13px; font-weight: 600; color: var(--badge-text); margin-bottom: 10px; }
    .research-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Projects */
    .project-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .project-card:hover { transform: translateY(-2px); }
    .project-card .card-img {
      height: 160px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #dce9f7, #e8f2fb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      overflow: hidden;
    }
    .project-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .project-card .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .project-card h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      min-height: 2.4em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .project-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 4.5em;
    }

    /* Contact */
    .contact-section { text-align: center; }
    .contact-links { display: flex; justify-content: center; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .contact-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .contact-link:hover { background: rgba(0,117,222,0.06); }

    .data-error {
      max-width: 40rem;
      margin: 20vh auto;
      padding: 0 24px;
      text-align: center;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .data-error code {
      font-size: 0.95em;
      color: var(--text-primary);
    }

    @media (max-width: 900px) {
      .card-track-scroll > * { flex-basis: calc((100% - 16px) / 2); }
    }
    @media (max-width: 640px) {
      nav { padding-top: env(safe-area-inset-top); }
      nav .nav-links { display: none; }
      nav .nav-inner { height: auto; min-height: 54px; padding-top: 10px; padding-bottom: 10px; }
      nav .logo { font-size: 14px; }
      .hero {
        padding: 36px 20px 16px;
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
      }
      .hero h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.03em; }
      .hero .photo { width: 112px; height: 112px; }
      .hero .subtitle { font-size: 15px; margin-bottom: 22px; }
      .hero-stats { gap: 26px; }
      .hero-stats .stat b { font-size: 22px; }
      .hero-stats .stat span { font-size: 12px; }
      section h2 { font-size: 32px; }
      section {
        padding: 48px 20px;
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
      }
      .about-grid { grid-template-columns: 1fr; }
      .timeline { padding-left: 20px; margin-left: 4px; }
      .timeline-item::before { left: -26px; }
      .card-track-scroll > * { flex-basis: 85%; }
      .track-btn { width: 44px; height: 44px; font-size: 24px; }
      .contact-links {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .contact-link {
        min-height: 44px;
        justify-content: center;
        width: 100%;
      }
      #contact {
        padding-bottom: max(48px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

<nav id="main-nav"></nav>
<header class="hero" id="hero-section"></header>
<section id="about"></section>
<section class="warm" id="experience"><div class="inner"></div></section>
<section id="skills"></section>
<section class="warm" id="research"><div class="inner"></div></section>
<section id="projects"></section>
<section class="warm" id="contact"><div class="inner contact-section"></div></section>

<script>
// 語言由網址決定：/en/ 之下是英文版，其餘是中文版。
// 首頁 HTML 在中英兩邊是同一份，所以切換鍵與資料檔名都在這裡算。
const LANG = location.pathname.replace(/\/index\.html?$/i, '/').split('/').filter(Boolean)[0] === 'en'
  ? 'en' : 'zh';
const IS_EN = LANG === 'en';

const UI = {
  zh: {
    prev: '上一則',
    next: '下一則',
    more: '查看介紹 →',
    langLabel: 'EN',
    langAria: 'Switch to English',
    langTag: 'en',
    langHreflang: 'en',
    loadError: '無法載入 <code>data.json</code>。請用本機伺服器或 GitHub Pages 開啟，不要直接雙擊 HTML。<br>'
      + '在專案目錄執行 <code>node serve.mjs</code>，再開 <code>http://127.0.0.1:8766/style-4-notion-warm.html</code>。'
  },
  en: {
    prev: 'Previous',
    next: 'Next',
    more: 'View details →',
    langLabel: '中文',
    langAria: '切換至中文版',
    langTag: 'zh-Hant',
    langHreflang: 'zh-Hant',
    loadError: 'Could not load <code>data.json</code>. Open the site through a local server or GitHub Pages — '
      + 'do not double-click the HTML file.<br>Run <code>node serve.mjs</code> in the project folder, then open '
      + '<code>http://127.0.0.1:8766/</code>.'
  }
};
const T = UI[LANG];

// 語言切換。中英首頁在樹上的深度不同（/ 與 /en/），所以各自寫一條相對路徑；
// GitHub Pages 是 repo 子路徑，不能用 /en/... 這種站根絕對路徑。
// onclick 只記住選擇，讓 root 的語言入口下次直接帶到對的版本。
function langSwitch() {
  const href = IS_EN ? '../style-4-notion-warm.html' : 'en/';
  const remember = IS_EN ? 'zh' : 'en';
  return `<a class="nav-lang" href="${href}" lang="${T.langTag}" hreflang="${T.langHreflang}"`
    + ` aria-label="${T.langAria}"`
    + ` onclick="try{localStorage.setItem('site-lang','${remember}')}catch(e){}">${T.langLabel}</a>`;
}

function render(d) {

  // <html lang> 要放「這一頁自己的語言」，不是切換鍵要去的語言（T.langTag）
  document.documentElement.lang = IS_EN ? 'en' : 'zh-Hant';
  document.title = d.page.title;

  // --- Nav ---
  const nav = document.getElementById('main-nav');
  nav.innerHTML = `
    <div class="nav-inner">
      <a href="#hero-section" class="logo">${d.nav.logo}</a>
      <div class="nav-end">
        <ul class="nav-links">
          ${d.nav.links.map(l => `<li><a href="${l.href}">${l.label}</a></li>`).join('')}
        </ul>
        <div class="nav-actions">
          ${langSwitch()}
          <a href="${d.nav.cta.href}" class="nav-cta">${d.nav.cta.label}</a>
        </div>
      </div>
    </div>`;

  // --- Hero ---
  document.getElementById('hero-section').innerHTML = `
    ${d.hero.photo ? `<img class="photo" src="${d.hero.photo}" alt="Brian">` : ''}
    <h1>${d.hero.greeting}</h1>
    <p class="subtitle">${d.hero.subtitle}</p>
    ${d.hero.stats ? `<div class="hero-stats">${d.hero.stats.map(s => `<div class="stat"><b>${s.value}</b><span>${s.label}</span></div>`).join('')}</div>` : ''}
    ${d.hero.buttons ? `<div class="cta-group">${d.hero.buttons.map(b => `<a href="${b.href}" class="${b.class}">${b.label}</a>`).join('')}</div>` : ''}`;

  // --- About ---
  document.getElementById('about').innerHTML = `
    <h2>${d.about.title}</h2>
    <p class="section-desc">${d.about.description}</p>
    <div class="about-grid">
      <div class="about-text">${d.about.paragraphs.map(p => `<p>${p}</p>`).join('')}</div>
      <div class="info-cards">
        ${d.about.info.map(i => `<div class="info-card">${i.icon ? `<strong>${i.icon}</strong>` : ''} ${i.text}</div>`).join('')}
      </div>
    </div>`;

  // --- Experience ---
  const exp = document.querySelector('#experience .inner');
  exp.innerHTML = `
    <h2>${d.experience.title}</h2>
    <p class="section-desc">${d.experience.description}</p>
    <div class="timeline">
      ${d.experience.items.map(e => `
        <div class="timeline-item">
          <div class="date">${e.date}</div>
          <h3>${e.title}</h3>
          <div class="org">${e.org}</div>
          ${e.description ? `<p>${e.description}</p>` : ''}
          ${e.details ? `<ul class="details">${e.details.map(d => `<li>${d}</li>`).join('')}</ul>` : ''}
        </div>`).join('')}
    </div>`;

  // --- Skills ---
  document.getElementById('skills').innerHTML = `
    <h2>${d.skills.title}</h2>
    <p class="section-desc">${d.skills.description}</p>
    <div class="skills-grid">
      ${d.skills.categories.map(c => `
        ${c.link ? `<a href="${c.link}" class="skill-card">` : '<div class="skill-card">'}
          <h3>${c.name}</h3>
          <div class="tag-list">
            ${c.tags.map(t => `<span class="tag">${typeof t === 'string' ? t : t.name}</span>`).join('')}
          </div>
        ${c.link ? '</a>' : '</div>'}`).join('')}
    </div>`;

  const trackControls = `
    <div class="card-track-nav">
      <button type="button" class="track-btn" data-track-prev aria-label="${T.prev}"><i class="ph ph-arrow-left"></i></button>
      <button type="button" class="track-btn" data-track-next aria-label="${T.next}"><i class="ph ph-arrow-right"></i></button>
    </div>`;

  function setupCardTrack(root) {
    const scroller = root.querySelector('.card-track-scroll');
    const prev = root.querySelector('[data-track-prev]');
    const next = root.querySelector('[data-track-next]');
    if (!scroller || !prev || !next) return;

    const step = () => {
      const card = scroller.firstElementChild;
      if (!card) return scroller.clientWidth;
      const gap = parseFloat(getComputedStyle(scroller).gap) || 16;
      return card.getBoundingClientRect().width + gap;
    };
    const update = () => {
      const max = scroller.scrollWidth - scroller.clientWidth - 2;
      prev.disabled = scroller.scrollLeft <= 2;
      next.disabled = scroller.scrollLeft >= max;
    };

    prev.addEventListener('click', () => scroller.scrollBy({ left: -step(), behavior: 'smooth' }));
    next.addEventListener('click', () => scroller.scrollBy({ left: step(), behavior: 'smooth' }));
    scroller.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  // --- Research ---
  const resInner = document.querySelector('#research .inner');
  resInner.innerHTML = `
    <h2>${d.research.title}</h2>
    <p class="section-desc">${d.research.description}</p>
    <div class="card-track">
      ${trackControls}
      <div class="card-track-scroll" tabindex="0">
        ${d.research.papers.map(p => `
          ${p.link ? `<a href="${p.link}" class="research-card">` : '<article class="research-card">'}
            <h3>${p.title}</h3>
            <div class="journal">${p.journal}</div>
            <p>${p.description}</p>
            <div class="tag-list">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            ${p.link ? `<div class="card-more">${T.more}</div>` : ''}
          ${p.link ? '</a>' : '</article>'}`).join('')}
      </div>
    </div>`;

  // --- Projects ---
  document.getElementById('projects').innerHTML = `
    <h2>${d.projects.title}</h2>
    <p class="section-desc">${d.projects.description}</p>
    <div class="card-track">
      ${trackControls}
      <div class="card-track-scroll" tabindex="0">
        ${d.projects.items.map(p => `
          ${p.link ? `<a href="${p.link}" class="project-card">` : '<div class="project-card">'}
            <div class="card-img">${p.img ? `<img src="${p.img}" alt="${p.title}">` : p.icon}</div>
            <div class="card-body">
              <h3>${p.title}</h3>
              <p>${p.description}</p>
            </div>
          ${p.link ? '</a>' : '</div>'}
        `).join('')}
      </div>
    </div>`;

  document.querySelectorAll('.card-track').forEach(setupCardTrack);

  // --- Contact ---
  const contact = document.querySelector('#contact .inner');
  contact.innerHTML = `
    <h2>${d.contact.title}</h2>
    <p class="section-desc">${d.contact.description}</p>
    <div class="contact-links">
      ${d.contact.links.map(l => {
        const external = /^https?:/i.test(l.href);
        const extra = external ? ' target="_blank" rel="noopener noreferrer"' : '';
        return `<a class="contact-link" href="${l.href}"${extra}><i class="${l.icon}"></i> ${l.label}</a>`;
      }).join('')}
    </div>`;
}

async function boot() {
  try {
    // 英文版讀自己的資料檔；檔名明示語言，避免兩份資料改錯邊
    const dataUrl = IS_EN ? 'data.en.json' : 'data.json';
    const res = await fetch(dataUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.statusText);
    render(await res.json());
  } catch (err) {
    console.error(err);
    document.body.innerHTML = `<p class="data-error">${T.loadError}</p>`;
  }
}

boot();
</script>

</body>
</html>
