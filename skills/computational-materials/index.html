<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>技能</title>
  <link rel="icon" type="image/png" href="../../assets/application-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #e8f2fb;
      --bg-gradient-start: #e8f2fb;
      --bg-gradient-mid: #eef5fc;
      --bg-gradient-end: #f4f8fd;
      --text-primary: rgba(0,0,0,0.95);
      --text-secondary: var(--text-primary);
      --text-tertiary: #718096;
      --accent: #0075de;
      --accent-hover: #005bab;
      --badge-bg: #e8f4fd;
      --badge-text: #0068d6;
      --border: rgba(0,0,0,0.08);
      --card-bg: rgba(255,255,255,0.75);
      --shadow-card: rgba(0,0,0,0.04) 0px 4px 18px, rgba(0,0,0,0.02) 0px 2px 7px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 40%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(232,242,251,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    nav .nav-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 24px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
    }
    nav .logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
    }
    .nav-cta {
      background: var(--accent);
      color: #fff;
      padding: 7px 15px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-cta:hover { background: var(--accent-hover); }
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      padding-bottom: max(80px, env(safe-area-inset-bottom));
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .lede {
      color: var(--text-secondary);
      font-size: 16px;
      margin-bottom: 36px;
      max-width: 40rem;
    }
    .skill-table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    table.skill-table {
      width: 100%;
      border-collapse: collapse;
    }
    table.skill-table th,
    table.skill-table td {
      text-align: left;
      padding: 16px 20px;
      vertical-align: top;
    }
    table.skill-table thead th {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--badge-text);
      background: var(--badge-bg);
      border-bottom: 1px solid var(--border);
    }
    table.skill-table tbody tr + tr td {
      border-top: 1px solid var(--border);
    }
    table.skill-table .name {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      width: 28%;
    }
    table.skill-table .detail {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .data-error {
      text-align: center;
      color: var(--text-secondary);
      margin-top: 20vh;
    }
    @media (max-width: 640px) {
      h1 { font-size: 32px; }
      main { padding-top: 32px; }
      table.skill-table thead { display: none; }
      table.skill-table,
      table.skill-table tbody,
      table.skill-table tr,
      table.skill-table td {
        display: block;
        width: 100%;
      }
      table.skill-table .name {
        white-space: normal;
        width: 100%;
        padding-bottom: 4px;
        color: var(--badge-text);
      }
      table.skill-table .detail { padding-top: 0; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="logo" id="nav-logo" href="../../style-4-notion-warm.html">簡歷首頁</a>
    <a class="nav-cta" href="../../style-4-notion-warm.html#skills">返回技能</a>
  </div>
</nav>
<main id="main"></main>
<script>
(async function () {
  const main = document.getElementById('main');
  try {
    const res = await fetch('../../data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.statusText);
    const d = await res.json();
    const parts = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
    let slug = parts[parts.length - 1] || '';
    if (slug === 'index.html') slug = parts[parts.length - 2] || '';
    const cat = (d.skills.categories || []).find(c =>
      c.slug === slug || (c.link && c.link.indexOf('skills/' + slug + '/') !== -1)
    );
    if (!cat) throw new Error('category missing');
    document.title = cat.name + ' — ' + d.nav.logo;
    document.getElementById('nav-logo').textContent = d.nav.logo;
    const rows = (cat.tags || []).map(t => {
      const name = typeof t === 'string' ? t : t.name;
      const detail = typeof t === 'string' ? '' : (t.detail || '');
      return `<tr><th class="name" scope="row">${name}</th><td class="detail">${detail}</td></tr>`;
    }).join('');
    main.innerHTML = `
      <h1>${cat.name}</h1>
      <p class="lede">${cat.intro || ''}</p>
      <div class="skill-table-wrap">
        <table class="skill-table">
          <thead>
            <tr><th>能力</th><th>我實際做過什麼</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch (err) {
    console.error(err);
    main.innerHTML = '<p class="data-error">無法載入資料。請用 <code>node serve.mjs</code> 或捷徑開啟網站，不要直接雙擊此頁。</p>';
  }
})();
</script>
</body>
</html>
